<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kickoff – eFootball tournaments</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--card:#131d33;--line:#23324f;--ink:#e9effd;--mute:#90a1c6;--acc:#2de2e6;--accink:#04282b;--gold:#ffc857;--bad:#ff7a7a;box-sizing:border-box}
@media (prefers-color-scheme:light){:root{--bg:#eef3fb;--card:#fff;--line:#d5deee;--ink:#0f1a30;--mute:#5a6b8c;--acc:#007f86;--accink:#fff;--gold:#b87a00;--bad:#c62828}}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Barlow,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:0 auto;padding:12px 16px}
.brand{font:800 26px "Barlow Condensed",sans-serif;color:var(--acc);text-decoration:none}
main{max-width:640px;margin:0 auto;padding:4px 16px 60px}
.hero{border-radius:22px;padding:22px 20px;background:radial-gradient(120% 90% at 100% 0,color-mix(in srgb,var(--acc) 30%,transparent),transparent 60%),var(--card);border:1px solid var(--line)}
.hero h1{font-size:clamp(38px,11vw,58px);line-height:.95}
.hero p{color:var(--mute);margin:8px 0 14px}
.btn{appearance:none;border:0;border-radius:12px;padding:11px 16px;font:700 16px Barlow,sans-serif;background:var(--acc);color:var(--accink);cursor:pointer;min-height:44px;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.s{padding:6px 12px;min-height:36px;font-size:14px}
:is(.btn,input,select,a):focus-visible{outline:2px solid var(--acc);outline-offset:2px}
section{margin-top:22px}
h2{font-size:28px;margin-bottom:10px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px;color:inherit;text-decoration:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px;color:var(--mute);white-space:nowrap}
.chip.ok{color:var(--acc);border-color:var(--acc)}.chip.bad{color:var(--bad);border-color:var(--bad)}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:500 16px Barlow,sans-serif;min-height:44px}
.mt{margin-top:14px}.sm{color:var(--mute);font-size:14px}
.empty{text-align:center;color:var(--mute);padding:22px 10px}
.team{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.team:first-child{border-top:0}
.logo{flex:none;width:36px;height:36px;border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;font:800 15px "Barlow Condensed",sans-serif;color:#fff}
.rnd{font:700 20px "Barlow Condensed",sans-serif;color:var(--mute);margin:16px 0 8px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:13px;color:var(--mute);font-weight:600;text-align:right;padding:6px 4px}
.tbl td{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl td:last-child{font:800 20px "Barlow Condensed",sans-serif;color:var(--acc)}
.sc{display:flex;gap:6px;align-items:center;margin-top:8px}
.sc input{width:56px;text-align:center}
.sf input[type=file]{width:100%;margin-top:8px;padding:8px 10px;font-size:14px}
.sf .sc .btn{margin-left:auto}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:9;max-width:90vw}
#modal:not(:empty){position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:8}
#modal .card{max-width:420px;width:100%;margin:0}
</style>
</head>
<body>
<header class="top"><a class="brand" href="#">Kickoff</a><div id="auth"></div></header>
<main id="app"><div class="empty">Loading…</div></main>
<div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://fgyuawqqribuxqnxlbwi.supabase.co';
const SUPABASE_KEY='sb_publishable_Xy_kjm8Y9tozIwzZxi_7Eg_wanvpQu6';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,cur=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2800)};
const COLORS=['#e63946','#1d7ae0','#2a9d5c','#e08a1d','#8e44ad','#0fa3b1','#c2185b','#546e7a'];
const logo=t=>t.logo_url?`<img class="logo" src="${esc(t.logo_url)}" alt="">`:`<span class="logo" style="background:${COLORS[t.name.length%COLORS.length]}">${esc(t.name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase())}</span>`;
const slugify=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'cup';
const ext=f=>(f.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').slice(0,5)||'jpg';
const fail=e=>{toast(e.message||'Something went wrong');return true};

async function render(){
  $('auth').innerHTML=user?'<button class="btn ghost s" onclick="sb.auth.signOut()">Sign out</button>':'<button class="btn s" onclick="location.hash=\'login\'">Sign in</button>';
  const h=location.hash.slice(1);
  try{
    if(h==='login')loginView();
    else if(h.startsWith('t-'))await tourView(h.slice(2));
    else await homeView();
  }catch(e){$('app').innerHTML=`<div class="card empty">Could not load: ${esc(e.message)}</div>`}
}

function loginView(){
  $('app').innerHTML=`<section><h2>Sign in</h2><form class="card" onsubmit="login(event)"><label for="em">Email</label><input id="em" name="email" type="email" required autocomplete="email" placeholder="you@example.com"><p class="sm">We email you a sign-in link. No password needed.</p><button class="btn">Send sign-in link</button></form></section>`;
}
async function login(e){
  e.preventDefault();
  const {error}=await sb.auth.signInWithOtp({email:e.target.email.value.trim(),options:{emailRedirectTo:location.href.split('#')[0]}});
  if(error)return fail(error);
  $('app').innerHTML='<div class="card empty">Check your email and open the sign-in link on this device.</div>';
}

async function homeView(){
  const {data:ts,error}=await sb.from('tournaments').select('name,slug,status').order('created_at',{ascending:false});
  if(error)throw error;
  $('app').innerHTML=`<div class="hero"><h1>Run your eFootball tournament</h1><p>Create a league, collect teams, share one link. Captains send scores with screenshots, and matching results confirm automatically.</p>${user?'':'<button class="btn" onclick="location.hash=\'login\'">Sign in to start</button>'}</div>
  ${user?`<section><h2>New tournament</h2><form class="card" onsubmit="createTour(event)"><label for="tn">Name</label><input id="tn" name="name" required minlength="2" maxlength="60" placeholder="Friday Night Cup"><label for="lg">Format</label><select id="lg" name="legs"><option value="1">League, single round-robin</option><option value="2">League, home and away</option></select><div class="mt"><button class="btn">Create tournament</button></div></form></section>`:''}
  <section><h2>Tournaments</h2>${ts.length?ts.map(t=>`<a class="card row" href="#t-${esc(t.slug)}"><b>${esc(t.name)}</b><span class="chip">${esc(t.status)}</span></a>`).join(''):'<div class="card empty">No tournaments yet.</div>'}</section>`;
}
async function createTour(e){
  e.preventDefault();const f=e.target,name=f.name.value.trim();
  const slug=slugify(name)+'-'+Math.random().toString(36).slice(2,6);
  const {error}=await sb.from('tournaments').insert({name,slug,legs:+f.legs.value});
  if(error)return fail(error);
  location.hash='t-'+slug;
}

async function tourView(slug){
  const {data:t,error}=await sb.from('tournaments').select('*').eq('slug',slug).maybeSingle();
  if(error)throw error;
  if(!t){$('app').innerHTML='<div class="card empty">Tournament not found.</div>';return}
  const [tm,mt,st]=await Promise.all([
    sb.from('teams').select('*').eq('tournament_id',t.id).order('created_at'),
    sb.from('matches').select('*').eq('tournament_id',t.id).order('round'),
    sb.from('league_standings').select('*').eq('tournament_id',t.id).order('points',{ascending:false}).order('goal_diff',{ascending:false})]);
  for(const r of [tm,mt,st])if(r.error)throw r.error;
  const teams=tm.data,matches=mt.data,own=!!user&&t.owner_id===user.id;
  cur={t,teams,matches};
  const byId=Object.fromEntries(teams.map(x=>[x.id,x]));
  const mine=user?teams.filter(x=>x.captain_user_id===user.id):[];
  const approved=teams.filter(x=>x.status==='approved');
  const rounds=[...new Set(matches.map(m=>m.round))];
  const nm=id=>byId[id]?esc(byId[id].name):'?';
  const matchCard=m=>{
    const done=m.status==='confirmed'||m.status==='walkover';
    const my=mine.find(x=>x.id===m.home_team_id||x.id===m.away_team_id);
    const chip=m.status==='walkover'?'<span class="chip">walkover</span>':done?'':`<span class="chip ${m.status==='disputed'?'bad':''}">${m.status==='awaiting'?'awaiting 2nd score':esc(m.status)}</span>`;
    return `<div class="card"><div class="row"><span>${nm(m.home_team_id)}</span><b>${done?`${m.home_score} – ${m.away_score}`:'vs'}</b><span style="text-align:right">${nm(m.away_team_id)}</span></div>
    <div class="row sm" style="margin-top:6px">${chip}${own&&(m.status==='disputed'||m.status==='awaiting')?`<button class="btn ghost s" onclick="proofs('${m.id}')">View proofs</button>`:''}</div>
    ${my&&!done?`<form class="sf" onsubmit="submitRes(event,'${m.id}','${my.id}')"><div class="sc"><input name="h" type="number" min="0" max="99" required aria-label="Home goals"><span>–</span><input name="a" type="number" min="0" max="99" required aria-label="Away goals"><button class="btn s">Send result</button></div><input name="p" type="file" accept="image/*" required aria-label="Screenshot proof"><div class="sm">Score as home – away, with a screenshot.</div></form>`:''}
    ${own&&!done?`<div class="sm" style="margin-top:10px">Organizer: set the result directly</div><form class="sf" onsubmit="rule(event,'${m.id}')"><div class="sc"><input name="h" type="number" min="0" max="99" required aria-label="Final home goals"><span>–</span><input name="a" type="number" min="0" max="99" required aria-label="Final away goals"><button class="btn s">Save result</button></div></form><div class="acts"><button class="btn ghost s" onclick="walkover('${m.id}','h')">Home wins by walkover</button><button class="btn ghost s" onclick="walkover('${m.id}','a')">Away wins by walkover</button></div>`:''}</div>`;
  };
  $('app').innerHTML=`<section style="margin-top:6px"><div class="row"><h2 style="margin:0">${esc(t.name)}</h2><span class="chip ok">${esc(t.status)}</span></div>
  <p class="sm">${t.legs==2?'Home and away':'Single'} round-robin · ${approved.length} teams approved</p>
  <button class="btn ghost s" onclick="navigator.clipboard.writeText(location.href).then(()=>toast('Link copied'))">Copy share link</button></section>
  ${own&&t.status==='registration'?`<section><div class="card"><b>Organizer</b><p class="sm">Approve teams below, then generate fixtures (needs at least 3 approved). Registration closes when fixtures are generated.</p><button class="btn" onclick="generate()">Generate fixtures</button></div></section>`:''}
  ${st.data.length?`<section><h2>Standings</h2><div class="card" style="overflow-x:auto"><table class="tbl"><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead><tbody>${st.data.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.played}</td><td>${r.won}</td><td>${r.drawn}</td><td>${r.lost}</td><td>${r.goal_diff>0?'+':''}${r.goal_diff}</td><td>${r.points}</td></tr>`).join('')}</tbody></table></div></section>`:''}
  ${rounds.length?`<section><h2>Fixtures</h2>${rounds.map(r=>`<div class="rnd">Matchday ${r}</div>${matches.filter(m=>m.round===r).map(matchCard).join('')}`).join('')}</section>`:''}
  <section><h2>Teams (${teams.length})</h2><div class="card">${teams.length?teams.map(x=>`<div class="team">${logo(x)}<div style="flex:1;min-width:0"><div style="font-weight:600">${esc(x.name)}</div><div class="sm">${esc(x.efootball_id||'No ID')} · ${esc(x.captain_name||'No captain')}</div></div>${x.status==='approved'?'':`<span class="chip ${x.status==='rejected'?'bad':''}">${esc(x.status)}</span>`}${own&&x.status==='pending'?`<button class="btn s" onclick="setTeam('${x.id}','approved')">Approve</button><button class="btn ghost s" onclick="setTeam('${x.id}','rejected')">Reject</button>`:''}</div>`).join(''):'<div class="empty">No teams yet.</div>'}</div></section>
  ${t.status==='registration'?(user?`<section><h2>Register a team</h2><form class="card" onsubmit="regTeam(event)"><label for="n">Team name</label><input id="n" name="name" required minlength="2" maxlength="24"><label for="e">eFootball ID</label><input id="e" name="efid" maxlength="20"><label for="c">Captain name</label><input id="c" name="cap" maxlength="30"><label for="l">Logo (optional)</label><input id="l" name="logo" type="file" accept="image/*"><div class="mt"><button class="btn">Submit for approval</button></div></form></section>`:`<section><div class="card empty">Sign in to register your team.<br><br><button class="btn" onclick="location.hash='login'">Sign in</button></div></section>`):''}`;
}

async function regTeam(e){
  e.preventDefault();const f=e.target,t=cur.t,file=f.logo.files[0];
  let logo_url=null;
  if(file){
    if(file.size>3e6)return toast('Logo must be under 3 MB');
    const path=`${t.id}/${user.id}-${Date.now()}.${ext(file)}`;
    const up=await sb.storage.from('logos').upload(path,file);
    if(up.error)return fail(up.error);
    logo_url=sb.storage.from('logos').getPublicUrl(path).data.publicUrl;
  }
  const {error}=await sb.from('teams').insert({tournament_id:t.id,name:f.name.value.trim(),efootball_id:f.efid.value.trim()||null,captain_name:f.cap.value.trim()||null,captain_user_id:user.id,logo_url});
  if(error)return fail(error.code==='23505'?{message:'That team name is taken'}:error);
  toast('Submitted. Waiting for approval');render();
}
async function setTeam(id,status){const {error}=await sb.from('teams').update({status}).eq('id',id);if(error)return fail(error);render()}

async function generate(){
  const {t,teams}=cur,ids=teams.filter(x=>x.status==='approved').map(x=>x.id);
  if(ids.length<3)return toast('Approve at least 3 teams first');
  if(!confirm('Generate fixtures? Registration will close.'))return;
  if(ids.length%2)ids.push(null);
  const n=ids.length;let arr=ids.slice();const rounds=[];
  for(let r=0;r<n-1;r++){const ms=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];if(a&&b)ms.push(r%2?[b,a]:[a,b])}rounds.push(ms);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}
  const all=rounds.slice();if(t.legs==2)rounds.forEach(ms=>all.push(ms.map(m=>[m[1],m[0]])));
  const rows=[];all.forEach((ms,r)=>ms.forEach(m=>rows.push({tournament_id:t.id,round:r+1,home_team_id:m[0],away_team_id:m[1]})));
  const a=await sb.from('matches').insert(rows);if(a.error)return fail(a.error);
  const b=await sb.from('tournaments').update({status:'live'}).eq('id',t.id);if(b.error)return fail(b.error);
  toast('Fixtures generated');render();
}

async function submitRes(e,matchId,teamId){
  e.preventDefault();const f=e.target,file=f.p.files[0];
  if(file.size>5e6)return toast('Screenshot must be under 5 MB');
  const path=`${matchId}/${teamId}-${Date.now()}.${ext(file)}`;
  const up=await sb.storage.from('proofs').upload(path,file);if(up.error)return fail(up.error);
  const {error}=await sb.from('result_submissions').upsert({match_id:matchId,team_id:teamId,home_score:+f.h.value,away_score:+f.a.value,screenshot_url:path},{onConflict:'match_id,team_id'});
  if(error)return fail(error);
  toast('Result sent');render();
}
async function rule(e,matchId){
  e.preventDefault();const f=e.target;
  const {error}=await sb.from('matches').update({home_score:+f.h.value,away_score:+f.a.value,status:'confirmed'}).eq('id',matchId);
  if(error)return fail(error);
  toast('Result saved');render();
}
async function walkover(id,side){
  if(!confirm('Award a 3–0 walkover win?'))return;
  const {error}=await sb.from('matches').update({home_score:side==='h'?3:0,away_score:side==='h'?0:3,status:'walkover'}).eq('id',id);
  if(error)return fail(error);
  toast('Walkover recorded');render();
}
async function proofs(matchId){
  const {data,error}=await sb.from('result_submissions').select('team_id,home_score,away_score,screenshot_url').eq('match_id',matchId);
  if(error)return fail(error);
  const rows=await Promise.all(data.map(async s=>{
    const u=s.screenshot_url?(await sb.storage.from('proofs').createSignedUrl(s.screenshot_url,600)).data:null;
    const t=cur.teams.find(x=>x.id===s.team_id);
    return `<div class="team"><div style="flex:1"><b>${esc(t?t.name:'Team')}</b><div class="sm">Reported ${s.home_score} – ${s.away_score}</div></div>${u?`<a class="btn ghost s" href="${esc(u.signedUrl)}" target="_blank" rel="noopener">Screenshot</a>`:''}</div>`;
  }));
  $('modal').innerHTML=`<div class="card"><h3>Submitted results</h3>${rows.join('')||'<p class="sm">No submissions.</p>'}<div class="mt"><button class="btn" onclick="$('modal').innerHTML=''">Close</button></div></div>`;
}

sb.auth.onAuthStateChange((_ev,s)=>{user=s?s.user:null;render()});
sb.auth.getSession().then(({data})=>{user=data.session?data.session.user:null;render()});
addEventListener('hashchange',render);
</script>
</body>
</html>
